
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8f7;
            color: #1d2722;
        }

        form {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 40px;

            border: 1px solid #e4e9e6;
            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .header {
            margin-bottom: 32px;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;

            color: #18211c;

            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            line-height: 1.5;

            color: #7a857f;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 500;

            color: #4b5851;
        }

        input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #d9dfdb;
            border-radius: 8px;

            background: #ffffff;

            font-size: 14px;
            color: #1e2923;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #a3aba6;
        }

        input:hover {
            border-color: #bdc8c1;
        }

        input:focus {
            border-color: #24834d;

            box-shadow:
                0 0 0 3px rgba(36, 131, 77, 0.08);
        }

        input[type="date"] {
            color: #68736d;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        button {
            width: 100%;
            height: 48px;

            margin-top: 8px;

            border: none;
            border-radius: 8px;

            background: #257a49;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        button:hover {
            background: #1f6940;
        }

        button:active {
            transform: scale(0.99);
        }

        .login {
            margin-top: 24px;

            text-align: center;

            font-size: 13px;
            color: #7a857f;
        }

        .login a {
            color: #257a49;

            font-weight: 600;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            form {
                padding: 28px 22px;
            }

            h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<form method="post" action="/efetuarCadastro">

    <div class="header">
        <h2>Criar conta</h2>

        <p class="subtitle">
            Preencha seus dados para acessar o estacionamento.
        </p>
    </div>

    <div class="field">
        <label for="inputNome">Nome</label>

        <input
                type="text"
                name="inputNomeCadastro"
                id="inputNome"
                placeholder="Seu nome completo"
        >
    </div>

    <div class="field">
        <label for="inputCPF">CPF</label>

        <input
                type="number"
                name="inputCPFCadastro"
                id="inputCPF"
                placeholder="000.000.000-00"
        >
    </div>

    <div class="field">
        <label for="inputEmailCadastro">E-mail</label>

        <input
                type="email"
                id="inputEmailCadastro"
                name="inputEmailCadastro"
                placeholder="seu@email.com"
        >
    </div>

    <div class="field">
        <label for="inputSenhaCadastro">Senha</label>

        <input
                type="password"
                id="inputSenhaCadastro"
                name="inputSenhaCadastro"
                placeholder="Crie uma senha"
        >
    </div>

    <div class="field">
        <label for="inputDataNascimento">
            Data de nascimento
        </label>

        <input
                type="date"
                name="inputDataNascimentoCadastro"
                id="inputDataNascimento"
        >
    </div>

    <div class="field">
        <label for="inputTelefone">Telefone</label>

        <input
                type="number"
                name="inputTelefone"
                id="inputTelefone"
                placeholder="(11) 99999-9999"
        >
    </div>

    <button type="submit">
        Criar conta
    </button>

    <p class="login">
        Já possui uma conta?
        <a href="/">Entrar</a>
    </p>

</form>

</body>
</html>
