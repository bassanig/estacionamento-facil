
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estacionamento - Registrar Entrada</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f6f8f7;
            color: #1d2722;
        }

        .container {
            width: 100%;
            max-width: 520px;

            padding: 40px;

            background: #ffffff;

            border: 1px solid #e4e9e6;
            border-radius: 14px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .header {
            margin-bottom: 32px;
        }

        h1 {
            margin-bottom: 8px;

            font-size: 28px;
            font-weight: 600;

            color: #18211c;
        }

        .subtitle {
            font-size: 14px;
            line-height: 1.5;

            color: #7a857f;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 500;

            color: #4b5851;
        }

        input,
        textarea {
            width: 100%;

            border: 1px solid #d9dfdb;
            border-radius: 8px;

            background: #ffffff;
            color: #1e2923;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input {
            height: 46px;
            padding: 0 14px;
        }

        textarea {
            min-height: 100px;

            padding: 12px 14px;

            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #a3aba6;
        }

        input:hover,
        textarea:hover {
            border-color: #bdc8c1;
        }

        input:focus,
        textarea:focus {
            border-color: #24834d;

            box-shadow:
                0 0 0 3px rgba(36, 131, 77, 0.08);
        }

        .botoes {
            display: flex;
            gap: 12px;

            margin-top: 28px;
        }

        button,
        .voltar {
            flex: 1;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.1s ease;
        }

        button {
            border: none;

            background: #257a49;
            color: #ffffff;
        }

        button:hover {
            background: #1f6940;
        }

        .voltar {
            border: 1px solid #d9dfdb;

            background: #ffffff;
            color: #55615b;
        }

        .voltar:hover {
            border-color: #b8c5bd;

            background: #f8faf9;
        }

        button:active,
        .voltar:active {
            transform: scale(0.99);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }

            .botoes {
                flex-direction: column-reverse;
            }

            button,
            .voltar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Registrar entrada</h1>

        <p class="subtitle">
            Informe os dados do veículo que está entrando no estacionamento.
        </p>
    </div>

    <form method="post" action="/veiculo/cadastrar">

        <div class="field">
            <label for="placa">Placa</label>

            <input
                    type="text"
                    id="placa"
                    name="placa"
                    placeholder="ABC1D23"
                    required
            >
        </div>

        <div class="field">
            <label for="modelo">Modelo</label>

            <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    placeholder="Honda Civic"
                    required
            >
        </div>

        <div class="field">
            <label for="cor">Cor</label>

            <input
                    type="text"
                    id="cor"
                    name="cor"
                    placeholder="Preto"
                    required
            >
        </div>

        <div class="field">
            <label for="observacao">
                Observação
            </label>

            <textarea
                    id="observacao"
                    name="observacao"
                    placeholder="Adicione uma observação, se necessário"
            ></textarea>
        </div>

        <div class="botoes">

            <a href="/painel" class="voltar">
                Voltar
            </a>

            <button type="submit">
                Registrar entrada
            </button>

        </div>

    </form>

</div>

</body>
</html>
