
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estacionamento - Login</title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        font-family: Arial, Helvetica, sans-serif;

        background: #f6f8f7;
        color: #1d2722;
    }

    form {
        width: 100%;
        max-width: 400px;

        padding: 40px;

        background: #ffffff;

        border: 1px solid #e4e9e6;
        border-radius: 14px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    .header {
        margin-bottom: 32px;
    }

    h2 {
        margin-bottom: 8px;

        font-size: 28px;
        font-weight: 600;

        color: #18211c;
    }

    .subtitle {
        font-size: 14px;
        line-height: 1.5;

        color: #7a857f;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;

        margin-bottom: 7px;

        font-size: 13px;
        font-weight: 500;

        color: #4b5851;
    }

    input {
        width: 100%;
        height: 46px;

        padding: 0 14px;

        border: 1px solid #d9dfdb;
        border-radius: 8px;

        background: #ffffff;

        font-size: 14px;
        color: #1e2923;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    input::placeholder {
        color: #a3aba6;
    }

    input:hover {
        border-color: #bdc8c1;
    }

    input:focus {
        border-color: #24834d;

        box-shadow:
            0 0 0 3px rgba(36, 131, 77, 0.08);
    }

    .remember-me {
        display: flex;
        align-items: center;

        gap: 8px;

        margin: 2px 0 20px;
    }

    .remember-me input {
        width: 15px;
        height: 15px;

        accent-color: #257a49;

        cursor: pointer;
    }

    .remember-me label {
        margin: 0;

        font-size: 13px;
        font-weight: 400;

        color: #68736d;

        cursor: pointer;
    }

    button {
        width: 100%;
        height: 48px;

        border: none;
        border-radius: 8px;

        background: #257a49;
        color: #ffffff;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }

    button:hover {
        background: #1f6940;
    }

    button:active {
        transform: scale(0.99);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .register {
        margin-top: 24px;

        text-align: center;

        font-size: 13px;

        color: #7a857f;
    }

    .register a {
        color: #257a49;

        font-weight: 600;
        text-decoration: none;
    }

    .register a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        form {
            padding: 28px 22px;
        }

        h2 {
            font-size: 25px;
        }
    }
  </style>
</head>

<body>

<form method="post" action="/autenticar">

  <div class="header">
    <h2>Entrar</h2>

    <p class="subtitle">
      Acesse sua conta para gerenciar seu estacionamento.
    </p>
  </div>

  <div class="field">
    <label for="inputEmail">E-mail</label>

    <input
            type="email"
            id="inputEmail"
            name="inputEmail"
            placeholder="seu@email.com"
    >
  </div>

  <div class="field">
    <label for="inputSenha">Senha</label>

    <input
            type="password"
            id="inputSenha"
            name="inputSenha"
            placeholder="Digite sua senha"
    >
  </div>

  <div class="remember-me">
    <input
            type="checkbox"
            id="remember"
            name="remember"
    >

    <label for="remember">
      Lembrar de mim
    </label>
  </div>

  <button type="submit">
    Entrar
  </button>

  <p class="register">
    Ainda não possui uma conta?
    <a href="/cadastro">Criar conta</a>
  </p>

</form>

</body>
</html>
